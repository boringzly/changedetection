[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geochangemllm"
version = "0.2.0"
description = "Minimal joint remote-sensing change detection and language-model training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "torch>=2.4",
]

[project.optional-dependencies]
qwen = [
  "accelerate==1.14.0",
  "peft==0.20.0",
  "transformers==5.14.1",
]
geo = ["rasterio==1.5.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
