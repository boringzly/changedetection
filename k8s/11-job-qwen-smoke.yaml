apiVersion: batch/v1
kind: Job
metadata:
  name: geochangemllm-qwen-smoke
  namespace: geochangemllm
  labels:
    app.kubernetes.io/name: geochangemllm
    app.kubernetes.io/component: qwen-train
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geochangemllm
        app.kubernetes.io/component: qwen-train
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          # Replace this image with your private/local registry address.
          image: geochangemllm:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              python -m geochangemllm.doctor
              if [[ ! -f /data/smoke/manifest.jsonl ]]; then
                python -m geochangemllm.make_smoke_data \
                  --output-dir /data/smoke \
                  --num-samples 32 \
                  --image-size 256
              fi
              torchrun --standalone --nproc_per_node=2 -m geochangemllm.train \
                --manifest /data/smoke/manifest.jsonl \
                --output-dir /data/outputs/qwen-smoke \
                --text-model Qwen/Qwen3-0.6B \
                --lora-rank 16 \
                --image-size 256 \
                --batch-size 2 \
                --grad-accum 2 \
                --epochs 20 \
                --max-steps 50 \
                --precision bf16 \
                --num-workers 4 \
                --log-every 1
              python -m geochangemllm.infer \
                --checkpoint /data/outputs/qwen-smoke/checkpoint.pt \
                --manifest /data/smoke/manifest.jsonl \
                --output-dir /data/outputs/qwen-infer \
                --generate-text
          env:
            - name: HOME
              value: /home/trainer
            - name: HF_HOME
              value: /cache/huggingface
            - name: HF_HUB_CACHE
              value: /cache/huggingface/hub
            - name: TORCH_HOME
              value: /cache/torch
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: NCCL_DEBUG
              value: INFO
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: OMP_NUM_THREADS
              value: "4"
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
            limits:
              cpu: "12"
              memory: 48Gi
              nvidia.com/gpu: "2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
            - name: home
              mountPath: /home/trainer
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: geochangemllm-data
        - name: cache
          persistentVolumeClaim:
            claimName: geochangemllm-cache
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
