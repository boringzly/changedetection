apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geochangemllm-data
  namespace: geochangemllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geochangemllm-cache
  namespace: geochangemllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
